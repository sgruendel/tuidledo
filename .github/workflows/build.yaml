name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Summarize coverage
        run: go tool cover -func=coverage.out -o=coverage-summary.out

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build .

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage-summary.out
          if-no-files-found: error

  coverage-badge:
    name: Update Coverage Badge
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    concurrency:
      group: coverage-badge-main
      cancel-in-progress: false

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Check coverage is current
        id: current
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$TESTED_SHA" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.current.outputs.update == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download coverage reports
        if: steps.current.outputs.update == 'true'
        uses: actions/download-artifact@v7
        with:
          name: coverage

      - name: Update coverage badge
        if: steps.current.outputs.update == 'true'
        uses: tj-actions/coverage-badge-go@481919ec72da287775fef015fd9011dc75a5db05 # v3
        with:
          filename: coverage-summary.out
          link: https://github.com/sgruendel/tuidledo/actions/workflows/build.yaml

      - name: Save coverage badge
        if: steps.current.outputs.update == 'true'
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'chore: update coverage badge'
          git push origin HEAD:main

  release:
    name: Release Binaries
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_suffix: linux_x86_64
            binary_name: tuidledo
            archive_ext: tar.gz
          - goos: windows
            goarch: amd64
            asset_suffix: windows_x86_64
            binary_name: tuidledo.exe
            archive_ext: zip
          - goos: darwin
            goarch: amd64
            asset_suffix: macos_x86_64
            binary_name: tuidledo
            archive_ext: tar.gz
          - goos: darwin
            goarch: arm64
            asset_suffix: macos_arm64
            binary_name: tuidledo
            archive_ext: tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          TOODLEDO_CLIENT_ID: ${{ secrets.TOODLEDO_CLIENT_ID }}
          TOODLEDO_CLIENT_SECRET: ${{ secrets.TOODLEDO_CLIENT_SECRET }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          BINARY_NAME: ${{ matrix.binary_name }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          test -n "$TOODLEDO_CLIENT_ID"
          test -n "$TOODLEDO_CLIENT_SECRET"

          dist_dir="dist/tuidledo_${VERSION}_${ASSET_SUFFIX}"
          archive_path="dist/tuidledo_${VERSION}_${ASSET_SUFFIX}.${ARCHIVE_EXT}"
          mkdir -p "$dist_dir"

          go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION -X main.clientID=$TOODLEDO_CLIENT_ID -X main.clientSecret=$TOODLEDO_CLIENT_SECRET" \
            -o "$dist_dir/$BINARY_NAME" \
            .

          cp README.md LICENSE "$dist_dir/"

          if [ "$ARCHIVE_EXT" = "zip" ]; then
            (
              cd dist
              zip -r "tuidledo_${VERSION}_${ASSET_SUFFIX}.zip" "tuidledo_${VERSION}_${ASSET_SUFFIX}"
            )
          else
            tar -C dist -czf "$archive_path" "tuidledo_${VERSION}_${ASSET_SUFFIX}"
          fi

          sha256sum "$archive_path" > "$archive_path.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tuidledo_${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}_${{ matrix.asset_suffix }}
          path: |
            dist/tuidledo_${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}_${{ matrix.asset_suffix }}.${{ matrix.archive_ext }}
            dist/tuidledo_${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}_${{ matrix.asset_suffix }}.${{ matrix.archive_ext }}.sha256

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/tuidledo_${{ github.ref_name }}_${{ matrix.asset_suffix }}.${{ matrix.archive_ext }}
            dist/tuidledo_${{ github.ref_name }}_${{ matrix.asset_suffix }}.${{ matrix.archive_ext }}.sha256
